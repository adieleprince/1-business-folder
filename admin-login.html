<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Royal Dynasty Fragrance</title>
  <meta name="description" content="Royal Dynasty Fragrance Admin Login — secure access for administrators only.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="RDF logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --white: #FFFFFF;
      --ivory: #F8F5F0;
      --card: #FFFDFB;
      --ink: #1C1A17;
      --ink-soft: #5C5650;
      --ink-faint: #948C7F;
      --bronze: #C49A6C;
      --bronze-deep: #9C7649;
      --bronze-pale: #EFE2D0;
      --line: #E7E0D5;
      --font-display: 'Playfair Display', serif;
      --font-body: 'Inter', sans-serif;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow-soft: 0 20px 50px -20px rgba(28, 26, 23, .22);
      --ease: cubic-bezier(.22, .61, .36, 1);
      --success: #2d7d46;
      --danger: #b91c1c;
    }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: linear-gradient(160deg, #221c16 0%, #3c3021 45%, #6d4e33 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: var(--radius-lg);
      padding: 2.8rem 2.2rem;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeUp 0.6s var(--ease);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 500px) {
      .login-container {
        padding: 2rem 1.5rem;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header .logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 8px;
      margin-bottom: 0.8rem;
    }

    .login-header h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    .login-header .subtitle {
      font-size: 0.85rem;
      color: var(--ink-soft);
      margin-top: 0.2rem;
    }

    .login-header .admin-badge {
      display: inline-block;
      background: var(--bronze);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      margin-top: 0.5rem;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 0.3rem;
      letter-spacing: 0.02em;
    }

    .form-group input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: var(--white);
      transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
      color: var(--ink);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--bronze);
      box-shadow: 0 0 0 4px rgba(196, 154, 108, 0.15);
    }

    .form-group input::placeholder {
      color: var(--ink-faint);
    }

    .form-group .input-icon {
      position: relative;
    }

    .form-group .input-icon svg {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--ink-faint);
    }

    .form-group .input-icon input {
      padding-left: 2.8rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 0.9rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), background 0.35s var(--ease);
      background: var(--bronze);
      color: #fff;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
    }

    .btn-primary:hover {
      background: var(--bronze-deep);
      transform: translateY(-2px);
      box-shadow: 0 16px 28px -12px rgba(156, 118, 73, 0.55);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.8rem;
      color: var(--ink-faint);
    }

    .login-footer a {
      color: var(--bronze-deep);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .login-footer a:hover {
      color: var(--ink);
    }

    /* Toast / Error message */
    .toast-message {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      display: none;
      animation: fadeUp 0.3s var(--ease);
    }

    .toast-message.error {
      display: block;
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .toast-message.success {
      display: block;
      background: #d1fae5;
      color: var(--success);
      border: 1px solid #a7f3d0;
    }

    .toast-message .icon {
      margin-right: 6px;
    }

    /* Lock icon */
    .lock-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 0.5rem;
    }

    .lock-icon svg {
      width: 48px;
      height: 48px;
      color: var(--bronze);
      opacity: 0.6;
    }

    /* Password toggle */
    .password-toggle {
      position: relative;
    }

    .password-toggle .toggle-btn {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-faint);
      font-size: 0.8rem;
      padding: 0.2rem;
    }

    .password-toggle .toggle-btn:hover {
      color: var(--ink);
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Shake animation for wrong credentials */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
      20%, 40%, 60%, 80% { transform: translateX(6px); }
    }

    .shake {
      animation: shake 0.5s var(--ease);
    }

    /* Brute force protection note */
    .security-note {
      margin-top: 1.2rem;
      padding: 0.6rem 1rem;
      background: var(--ivory);
      border-radius: var(--radius-md);
      font-size: 0.7rem;
      color: var(--ink-faint);
      text-align: center;
      border: 1px solid var(--line);
    }

    .security-note svg {
      width: 14px;
      height: 14px;
      vertical-align: middle;
      margin-right: 4px;
      color: var(--bronze);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <!-- Header -->
    <div class="login-header">
      <img src="RDF logo.png" alt="Royal Dynasty Fragrance" class="logo">
      <h1>Admin Access</h1>
      <p class="subtitle">Secure dashboard login</p>
      <span class="admin-badge">🔒 Restricted Area</span>
    </div>

    <!-- Lock Icon -->
    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>

    <!-- Login Form -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email" placeholder="admin@royaldynasty.com" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon password-toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-btn" id="togglePassword" aria-label="Toggle password visibility">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <span id="loginText">Sign In to Dashboard</span>
      </button>

      <div id="loginMessage" class="toast-message"></div>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <a href="royal-dynasty-fragrance.html">← Back to Store</a>
    </div>

    <!-- Security Note -->
    <div class="security-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4"/>
      </svg>
      This area is restricted to authorized administrators only.
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    'use strict';

    // ============================================================
    // JWT HELPERS
    // ============================================================
    function decodeJwtPayload(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const padded = base64.padEnd(base64.length + (4 - (base64.length % 4)) % 4, '=');
        return JSON.parse(atob(padded));
      } catch (e) {
        return null;
      }
    }

    function isTokenValid(token) {
      const payload = decodeJwtPayload(token);
      if (!payload || !payload.exp) return false;
      return Date.now() < payload.exp * 1000;
    }

    // ============================================================
    // DOM REFS
    // ============================================================
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginMessage = document.getElementById('loginMessage');
    const togglePasswordBtn = document.getElementById('togglePassword');

    // ============================================================
    // PASSWORD TOGGLE
    // ============================================================
    let passwordVisible = false;

    togglePasswordBtn.addEventListener('click', function() {
      passwordVisible = !passwordVisible;
      passwordInput.type = passwordVisible ? 'text' : 'password';
      this.textContent = passwordVisible ? '🙈' : '👁️';
    });

    // ============================================================
    // RATE LIMITING (prevent brute force)
    // ============================================================
    let loginAttempts = 0;
    const MAX_ATTEMPTS = 5;
    const LOCKOUT_TIME = 60000; // 60 seconds
    let lockoutTimer = null;
    let isLocked = false;

    function handleLockout() {
      isLocked = true;
      loginBtn.disabled = true;
      loginText.innerHTML = '⏳ Too many attempts. Wait 60s...';

      lockoutTimer = setTimeout(() => {
        isLocked = false;
        loginAttempts = 0;
        loginBtn.disabled = false;
        loginText.textContent = 'Sign In to Dashboard';
        loginMessage.className = 'toast-message';
        loginMessage.textContent = '';
        clearTimeout(lockoutTimer);
        lockoutTimer = null;
      }, LOCKOUT_TIME);
    }

    // ============================================================
    // LOGIN HANDLER
    // ============================================================
    form.addEventListener('submit', async function(e) {
  e.preventDefault();

  // Check if locked out
  if (isLocked) {
    showMessage(
      '⏳ Account temporarily locked. Please wait 60 seconds.',
      'error'
    );
    return;
  }

  // Get values
  const email = emailInput.value.trim();
  const password = passwordInput.value;

  // Basic validation
  if (!email || !password) {
    showMessage(
      '⚠️ Please enter both email and password.',
      'error'
    );

    shakeElement(form);
    return;
  }

  // Disable button while logging in
  loginBtn.disabled = true;
  loginText.innerHTML =
    '<span class="spinner"></span> Checking...';

  try {

    const response = await fetch(
      `${window.API_BASE_URL}/users/login`,
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          email: email,
          password: password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.message || 'Invalid email or password'
      );
    }

    // Only admin accounts may use this dashboard, even if the
    // email/password combination is valid for a regular customer.
    if (!data.user || !data.user.isAdmin) {
      throw new Error('This account does not have admin access.');
    }

    // LOGIN SUCCESSFUL
    loginAttempts = 0;

    showMessage(
      '✅ Login successful! Redirecting to dashboard...',
      'success'
    );

    // Store the real JWT issued by the backend — this is what
    // authorizes every admin API request from now on.
    localStorage.setItem('adminToken', data.token);
    localStorage.setItem('adminUser', JSON.stringify(data.user));

    loginText.innerHTML =
      '<span class="spinner"></span> Logging in...';

    setTimeout(() => {
      window.location.href = 'admin-dashboard.html';
    }, 1200);

  } catch (error) {

    console.error('LOGIN ERROR:', error);

    loginAttempts++;

    const remaining =
      MAX_ATTEMPTS - loginAttempts;

    let message =
      '❌ Invalid email or password.';

    if (remaining > 0) {

      message +=
        ` ${remaining} attempt${remaining > 1 ? 's' : ''} remaining.`;

    } else {

      message +=
        ' 🔒 Too many failed attempts. Locked for 60 seconds.';

    }

    showMessage(message, 'error');

    shakeElement(form);

    passwordInput.value = '';

    loginBtn.disabled = false;

    loginText.textContent =
      'Sign In to Dashboard';

    if (loginAttempts >= MAX_ATTEMPTS) {
      handleLockout();
    }

    emailInput.focus();
  }
});

    // ============================================================
    // HELPER FUNCTIONS
    // ============================================================

    function showMessage(text, type) {
      loginMessage.textContent = text;
      loginMessage.className = 'toast-message ' + type;
    }

    function shakeElement(el) {
      el.classList.remove('shake');
      // Trigger reflow
      void el.offsetWidth;
      el.classList.add('shake');
      setTimeout(() => {
        el.classList.remove('shake');
      }, 500);
    }

    // ============================================================
    // CHECK FOR EXISTING SESSION
    // ============================================================
    (function checkExistingSession() {
      try {
        const token = localStorage.getItem('adminToken');
        const userRaw = localStorage.getItem('adminUser');
        if (token && userRaw && isTokenValid(token)) {
          const user = JSON.parse(userRaw);
          if (user && user.isAdmin) {
            // Token is still valid, go straight to the dashboard
            window.location.href = 'admin-dashboard.html';
            return;
          }
        }
        // Missing, expired, or non-admin — clear any stale session
        localStorage.removeItem('adminToken');
        localStorage.removeItem('adminUser');
      } catch (e) {
        localStorage.removeItem('adminToken');
        localStorage.removeItem('adminUser');
      }
    })();

    // ============================================================
    // KEYBOARD SHORTCUTS
    // ============================================================
    document.addEventListener('keydown', function(e) {
      // Ctrl+Shift+L = Clear login form (convenience)
      if (e.ctrlKey && e.shiftKey && e.key === 'L') {
        e.preventDefault();
        form.reset();
        loginMessage.className = 'toast-message';
        loginMessage.textContent = '';
        loginBtn.disabled = false;
        loginText.textContent = 'Sign In to Dashboard';
        loginAttempts = 0;
        if (lockoutTimer) {
          clearTimeout(lockoutTimer);
          lockoutTimer = null;
          isLocked = false;
        }
      }
    });

    // ============================================================
    // LOG CONSOLE (for debugging - remove in production)
    // ============================================================
    console.log('✅ Admin Login Page loaded.');
    console.log('🔒 Only authorized administrators can access.');

    // ============================================================
    // CLEAR SESSION ON UNLOAD (optional)
    // ============================================================
    // Uncomment below if you want to clear session on tab close
    // window.addEventListener('beforeunload', function() {
    //   // localStorage.removeItem('adminToken');
    //   // localStorage.removeItem('adminUser');
    // });
  </script>

</body>
</html>
